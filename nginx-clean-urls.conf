# Silkwood Hotel — clean URLs + cache headers for nginx
# Staging server header: nginx (/.htaccess is not used).
#
# Add these directives inside the server { } block for
# staging.silkwoodhotels.com (and later silkwoodhotels.com).
# Then reload nginx: sudo nginx -t && sudo systemctl reload nginx
#
# Expected public URLs:
#   /  /rooms  /room-details  /dining  /facilities  /about  /contact  /terms  /coming
#
# Cache policy:
#   HTML (clean URLs via try_files) → Cache-Control: no-cache (store + must revalidate)
#   /css /js (fingerprinted ?v= hashes) → long-lived immutable
#   /images /assets → long-lived (stable filenames)

# 301: /index.html → /
location = /index.html {
    return 301 /;
}

# 301: /page.html → /page
location ~ ^/([^/]+)\.html$ {
    return 301 /$1;
}

# Fingerprinted code assets — long cache (URL changes when content changes via stamp)
location ^~ /css/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /js/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Media — long cache (not query-fingerprinted; filenames are stable)
location ^~ /images/ {
    add_header Cache-Control "public, max-age=31536000";
}

location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000";
}

# Clean URLs + other HTML via try_files — must revalidate
# Covers /, /rooms, /about, etc. (not only *.html paths)
location / {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "no-cache";
}
