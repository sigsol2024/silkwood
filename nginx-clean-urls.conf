# Silkwood Hotel — clean URLs for nginx
# Staging server header: nginx (/.htaccess is not used).
#
# Add these directives inside the server { } block for
# staging.silkwoodhotels.com (and later silkwoodhotels.com).
# Then reload nginx: sudo nginx -t && sudo systemctl reload nginx
#
# Expected public URLs:
#   /  /rooms  /room-details  /dining  /facilities  /about  /contact  /terms  /coming

# 301: /index.html → /
location = /index.html {
    return 301 /;
}

# 301: /page.html → /page  (assets under /css /js /images /assets are unaffected)
location ~ ^/([^/]+)\.html$ {
    return 301 /$1;
}

# Serve clean paths by falling back to the matching .html file
location / {
    try_files $uri $uri.html $uri/ =404;
}
